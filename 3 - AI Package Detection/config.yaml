name: Mailbox Classifier
description: Local HOG + color Random Forest classifier for mailbox empty/occupied detection.
version: "0.2.0"
slug: mailbox_classifier
init: false
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ingress: true
ingress_port: 8098
panel_icon: mdi:mailbox
map:
  - media:rw
options:
  model_path: "/data/mailbox_rf.joblib"
  default_image: "/media/current_mailbox.jpg"
schema:
  model_path: str
  default_image: str
ports:
  8098/tcp: null
