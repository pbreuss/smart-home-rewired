name: Image Classifier RFHOG by Smart Home Rewired
description: Classify images locally with your own trained AI model and use the results in Home Assistant automations.
url: https://github.com/pbreuss/smart-home-rewired/tree/main/Project%202%20-%20Ultimate%20Mailbox/AI%20Package%20Detection/Image%20Classification
version: "0.7.2"
slug: image_classifier_rfhog
init: false
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ingress: true
ingress_port: 8098
panel_icon: mdi:image-check-outline
map:
  - media:rw
options:
  model_path: "/data/mailbox_rfhog.joblib"
  default_image: "/media/current_mailbox.jpg"
schema:
  model_path: str
  default_image: str
ports:
  8098/tcp: null
