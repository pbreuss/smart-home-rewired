name: Image Classifier RFHOG
description: Local HOG + color Random Forest image classifier that can be used i.e. for mailbox empty/occupied detection.
version: "0.4.0"
slug: image_classifier_rfhog
init: false
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ingress: true
ingress_port: 8098
panel_icon: mdi:mailbox
map:
  - media:rw
options:
  model_path: "/data/mailbox_rfhog.joblib"
  default_image: "/media/current_mailbox.jpg"
schema:
  model_path: str
  default_image: str
ports:
  8098/tcp: null
